name: Build Helium for macOS

defaults:
  run:
    shell: bash

permissions:
  actions: read
  contents: read

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      os:
        required: true
        type: string
      resume:
        required: false
        type: boolean
        default: false
      resume_run_id:
        required: false
        type: string
        default: ''
    outputs:
      status:
        value: ${{ jobs.build_job.outputs.status }}

jobs:
  build_job:
    name: Build Helium for macOS
    runs-on: ${{ inputs.os }}
    # Avoid hard failures when GitHub's remote Actions cache service is unavailable.
    # sccache falls back to its local disk cache when the GHA backend is disabled.
    env:
      SCCACHE_GHA_ENABLED: "off"
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/prepare-environment
      - name: Download resources
        if: ${{ !inputs.resume }}
        uses: actions/download-artifact@v4
        with:
          name: helium_macos_resources_${{ inputs.arch }}
      - name: Unpack resources
        if: ${{ !inputs.resume }}
        run: ./github_unpack_resources.sh
      - name: Prepare for building
        if: ${{ !inputs.resume }}
        run: |
          set -o pipefail
          source ./devutils/shared.sh
          configure_build '${{ inputs.arch }}' true true | tee -a github_actions_build_${{ inputs.arch }}.log
        env:
          PROD_MACOS_SPARKLE_ED_PUB_KEY: ${{ secrets.PROD_MACOS_SPARKLE_ED_PUB_KEY }}
          PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
      - name: Get previous logs from this run
        if: ${{ inputs.resume && inputs.resume_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: github_build_logs_${{ inputs.arch }}
      - name: Get previous logs from checkpoint run
        if: ${{ inputs.resume && inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: github_build_logs_${{ inputs.arch }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Download build from this run
        if: ${{ inputs.resume && inputs.resume_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: github_build_artifact_${{ inputs.arch }}
      - name: Download build from checkpoint run
        if: ${{ inputs.resume && inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: github_build_artifact_${{ inputs.arch }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Unpack archive of build
        if: ${{ inputs.resume }}
        run: ./github_unpack_archive.sh
      - name: Patch restored Chromium checkpoint for download-bubble API
        if: ${{ inputs.resume_run_id != '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("build/src")
          header_path = root / "chrome/browser/ui/views/download/bubble/download_toolbar_ui_controller.h"
          source_path = root / "chrome/browser/ui/views/download/bubble/download_toolbar_ui_controller.cc"

          declaration = "  bool HasOpenOrPendingBubble() const;"
          header = header_path.read_text()
          if declaration not in header:
              anchor = "  bool IsShowingDetails() const override;"
              if header.count(anchor) != 1:
                  raise SystemExit("Could not find a unique IsShowingDetails declaration in the restored header")
              header = header.replace(anchor, anchor + "\n" + declaration, 1)
              header_path.write_text(header)

          signature = "bool DownloadToolbarUIController::HasOpenOrPendingBubble() const {"
          implementation = (
              signature + "\n"
              "  return bubble_delegate_ != nullptr || pending_bubble_;\n"
              "}\n"
          )
          source = source_path.read_text()
          if signature not in source:
              marker = "void DownloadToolbarUIController::OnOfflineItemsInitialized()"
              if marker in source:
                  position = source.index(marker)
                  source = source[:position] + implementation + "\n" + source[position:]
              else:
                  existing = "bool DownloadToolbarUIController::IsShowingDetails() const"
                  start = source.find(existing)
                  if start < 0:
                      raise SystemExit("Could not find a safe insertion point in the restored source")
                  brace = source.find("{", start)
                  depth = 0
                  end = None
                  for pos in range(brace, len(source)):
                      if source[pos] == "{":
                          depth += 1
                      elif source[pos] == "}":
                          depth -= 1
                          if depth == 0:
                              end = pos + 1
                              break
                  if end is None:
                      raise SystemExit("Could not find the end of IsShowingDetails in the restored source")
                  suffix = end
                  while suffix < len(source) and source[suffix] in "\r\n":
                      suffix += 1
                  source = source[:end] + "\n\n" + implementation.rstrip() + "\n\n" + source[suffix:]
              source_path.write_text(source)

          if declaration not in header_path.read_text() or signature not in source_path.read_text():
              raise SystemExit("Download-bubble compatibility patch did not produce both required declarations")
          print("Download-bubble compatibility API is present (checkpoint-safe, idempotent patch).")
          PY
      - uses: ./.github/actions/do-build
        id: build
        with:
          arch: ${{ inputs.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
          PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
          PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
